# Puerta de calidad de AMALIA: ruff + la suite de tests en cada cambio.
#
# Existe porque la suite (200+ tests) ya estaba escrita pero nada la ejecutaba:
# un cambio podía llegar a main sin que nada lo verificara. Fase 1 del plan de
# adopción de prácticas de NexoPay.
#
# NO instala navegadores de Playwright a propósito: la suite no los necesita
# —se verificó en un venv limpio sin `playwright install`— y bajarlos costaría
# ~150 MB y un minuto y medio en cada corrida. El día que haya un test que
# realmente abra un navegador, ese test debe pedirlo explícitamente.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: este workflow solo lee el código.
permissions:
  contents: read

# Una corrida por rama: si se empuja dos veces seguidas, la primera se cancela
# en vez de competir por runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .

  test:
    name: pytest · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Sin fail-fast: si 3.11 falla queremos ver igual el resultado de 3.12,
      # que es la versión que corre en producción.
      fail-fast: false
      matrix:
        # 3.12 es lo que corre en ambos Dockerfiles y por tanto en producción.
        # 3.11 está aquí para que `requires-python = ">=3.11"` sea una afirmación
        # verificada y no una aspiración: si se rompe, o se arregla o se sube el
        # piso declarado.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Los 6 tests de tests/integration/test_adb.py se saltan solos si no hay
      # credenciales de ADB, que es el caso en CI. No hace falta deseleccionarlos.
      - run: pytest -q

  shell:
    name: bancos de prueba de bash
    # Ni ssh-allow.sh ni amalia-pull-deploy.sh son Python, así que la puerta de
    # pytest no los mira — y son justamente los dos que deciden cosas caras y
    # silenciosas: quién puede entrar a una VM viva, y cuándo una VM cambia de
    # imagen sola. Sus bancos corren con stubs de `oci`, `docker`, `curl` y `nc`,
    # así que no tocan nada real.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # common.sh lee tenants.yaml con python3; es la única dependencia externa
      # de los bancos además de bash y jq, que el runner ya trae.
      - run: pip install pyyaml
      - run: bash scripts/test_ssh_allow.sh
      - run: bash scripts/test_pull_deploy.sh

  image:
    name: imagen x86 → GHCR
    # Nunca publicar una imagen que no pasó la puerta de calidad: si ruff o los
    # tests fallan, no hay artefacto que alguien pueda desplegar por error.
    needs: [lint, test, shell]
    # Solo en push. El trigger de pull_request dispararía un segundo build de
    # 2.7 GB del mismo commit, y una PR de un fork no tendría credenciales de
    # GHCR de todos modos.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # En qué refs se publica de verdad. En una rama de trabajo el job igual
      # construye y verifica el sello —que es donde se rompe un Dockerfile—
      # pero no sube nada: el repo es privado y GitHub Packages solo regala
      # 500 MB, así que publicar 2.7 GB por rama saldría caro rápido.
      PUBLICAR: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `format=long` a propósito: la etiqueta queda idéntica al SHA que
          # --version imprime dentro del contenedor. Así "qué imagen es esta"
          # y "qué código corre adentro" son literalmente la misma cadena, sin
          # traducir entre un short sha de 7 y el completo de 40.
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login en GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token efímero del propio workflow: no hay PAT que rotar ni que
          # guardar como secreto.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Lo que hace útil al sello: el SHA del commit se hornea en la imagen
          # (ARG GIT_SHA → ENV APP_VERSION).
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Al daemon local, no al registro: el paso siguiente necesita poder
          # ejecutarla antes de que se publique nada.
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Sin attestations: en GHCR aparecen como entradas "unknown/unknown"
          # junto a la imagen y solo ensucian la lista de versiones.
          provenance: false

      - name: Verificar el sello de versión
        # La imagen tiene que saber decir qué commit la produjo. Si esto falla,
        # el ARG se movió de lugar o alguien rompió --version, y publicarla
        # dejaría el despliegue pull de Fase 4 sin forma de comprobar qué corre.
        run: |
          ETIQUETA=ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          OBTENIDO=$(docker run --rm "$ETIQUETA" python -m src.main --version 2>/dev/null)
          echo "esperado: ${{ github.sha }}"
          echo "obtenido: $OBTENIDO"
          [ "$OBTENIDO" = "${{ github.sha }}" ]

      - name: Publicar
        if: env.PUBLICAR == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # Todo viene de la caché del paso anterior: esto sube capas, no
          # reconstruye.
          cache-from: type=gha
          provenance: false

      - name: Resumen
        run: |
          {
            echo "### Imagen"
            echo ""
            if [ "$PUBLICAR" = "true" ]; then
              echo "Publicada en GHCR:"
            else
              echo "Construida y verificada, **no publicada** (solo main, develop y tags publican):"
            fi
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
