# Dialecto Oracle del SQL de Track B, verificado contra un motor 23ai real.
#
# ── Qué agujero tapa ────────────────────────────────────────────────────────
# El ACL de red de la ADB solo admite la VCN y la IP pública de la VM: ni una
# laptop ni un runner de GitHub pueden conectarse. Hasta ahora, un ORA-00904 en
# una consulta de `src/memoria/` se descubría después de construir la imagen,
# publicarla, desplegarla y correrla en la VM. Este job lo descubre en segundos
# levantando el mismo motor 23ai en su edición Free dentro de un contenedor.
#
# ── Por qué NO vive en ci.yml ───────────────────────────────────────────────
# `ci.yml` es la puerta que corre en CADA push y hoy tarda menos de un minuto.
# Ese número es lo que la hace útil: se la espera antes de mergear. Los costos
# medidos/estimados de este job:
#
#   · imagen gvenzl/oracle-free:23-slim — 809 MB comprimidos (amd64, medido con
#     `docker manifest inspect`), ~1,5 GB descomprimidos. En un runner no está
#     cacheada: se baja entera cada vez. Estimado 60–120 s entre bajar y extraer.
#   · arranque del contenedor hasta `healthy` — 12 s medidos en una Mac arm64
#     con la imagen ya cacheada; en un runner de 4 vCPU, estimado 30–60 s.
#   · `pip install -e ".[dev]"` — ~20–30 s con la caché de pip.
#   · la suite en sí — 0,45 s medidos (25 tests).
#
# Total estimado: 2,5–4 min. Meter eso en `ci.yml` multiplicaría por ~4 la
# espera de TODOS los cambios, incluidos los que no tocan una línea de SQL, a
# cambio de nada. Por eso: workflow aparte y filtrado por rutas.
#
# ── Por qué filtrado por rutas y no en cada push ────────────────────────────
# El SQL de Track B vive en `src/memoria/` y `db/`. Un cambio en el scraper o
# en las plantillas de email no puede romperlo. `pyproject.toml` entra en la
# lista porque ahí está el pin de `oracledb`, que sí cambia cómo se habla con
# la base.
#
# Advertencia honesta sobre branch protection: un workflow con filtro `paths`
# NO reporta ningún check en las PRs que no tocan esas rutas. Si algún día se
# lo quiere marcar como check obligatorio en GitHub, esas PRs quedarían
# esperando para siempre. La forma de hacerlo entonces es mover el job a
# `ci.yml` con un `if` sobre rutas calculadas (dorny/paths-filter), que siempre
# reporta aunque sea saltado. Mientras no sea obligatorio, esto alcanza.
name: sql-oracle

# La lista de rutas está repetida en push y pull_request a propósito: GitHub
# Actions no soporta anchors de YAML (&x / *x), los rechaza al parsear.
on:
  push:
    paths:
      - "src/memoria/**"
      - "db/**"
      - "tests/integration/test_oracle_local.py"
      - "pyproject.toml"
      - ".github/workflows/sql-oracle.yml"
  pull_request:
    paths:
      - "src/memoria/**"
      - "db/**"
      - "tests/integration/test_oracle_local.py"
      - "pyproject.toml"
      - ".github/workflows/sql-oracle.yml"
  # Para forzarlo a mano cuando se quiere revalidar sin tocar esas rutas.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dialecto:
    name: SQL de Track B contra Oracle 23ai Free
    runs-on: ubuntu-latest
    # Generoso a propósito: lo que puede tardar es bajar la imagen, y un
    # timeout corto convertiría un día lento de Docker Hub en un falso rojo.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Levantar Oracle 23ai Free
        # El MISMO archivo que se usa en local (regla de oro: un solo hogar
        # para la definición del contenedor). `--wait` bloquea hasta que el
        # healthcheck de la imagen da verde, que es cuando la PDB acepta
        # conexiones — no basta con que el proceso viva.
        run: |
          docker compose -f db/docker-compose.oracle.yml up -d --wait --wait-timeout 600

      - name: Ejecutar la suite de dialecto
        # ORACLE_LOCAL_REQUERIDO=1 convierte "no hay contenedor" en fallo. Sin
        # esto, un contenedor que no arrancó dejaría los 25 tests en skip y el
        # job en verde: un guardián que aprueba sin mirar es peor que ninguno.
        env:
          ORACLE_LOCAL_REQUERIDO: "1"
        run: pytest -m oracle_local -v

      - name: Diagnóstico si algo falló
        if: failure()
        run: |
          docker compose -f db/docker-compose.oracle.yml ps
          docker compose -f db/docker-compose.oracle.yml logs --tail 100

      - name: Apagar y limpiar
        if: always()
        run: docker compose -f db/docker-compose.oracle.yml down -v
