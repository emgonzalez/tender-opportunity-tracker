    label: Servicios Profesionales TI
    items:
    - Implementación y consultoría de soluciones empresariales
    - Optimización y migración de bases de datos (Oracle)
    - Capacitación y certificación técnica (Fortinet ATC)
    - Soporte técnico especializado y mantenimiento
    - Migración a nube y modernización de infraestructura
    - Diseño e implementación de data centers
