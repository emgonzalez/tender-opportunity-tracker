      - IAM
    - id: onespan
      name: Onespan
      products:
      - firma digital
      - autenticación
      - prevención de fraude
      - onboarding digital
    - id: teramind
      name: Teramind
      products:
      - monitoreo de usuarios
      - DLP
      - detección de amenazas internas
