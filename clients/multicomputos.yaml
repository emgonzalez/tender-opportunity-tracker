  generated_at: '2026-03-30T20:40:04.715195-06:00'
  processes_analyzed: 46
  profile: >-
    # Perfil de Clasificación: Multicómputos El Salvador

    Multicómputos El Salvador participa predominantemente en licitaciones públicas
    para modernización tecnológica estatal, enfocadas en adquisición de infraestructura
    informática integral y licenciamiento de software. La empresa se posiciona como
    proveedor de soluciones que van más allá del reemplazo de equipos básicos, incluyendo
    virtualización, respaldo de datos, seguridad de red y servicios digitales certificados.
    Su participación abarca tanto procesos tradicionales de licitación como modalidades
    alternativas como subastas inversas y convenios, indicando capacidad operativa
    diversificada.

    **Categorías de productos y servicios principales:** Servidores y equipos informáticos
    (computadoras de escritorio, laptops, periféricos), infraestructura de red (switches,
    sistemas de respaldo, seguridad perimetral), licencias de software empresarial
    (Oracle, Adobe, Crystal Ball), certificados digitales y servicios de ciberseguridad,
    mantenimiento preventivo y correctivo de sistemas, conectividad y soluciones de
    virtualización.

    **Instituciones compradoras más recurrentes:** Ministerios de Educación, Salud
    y Agricultura; organismos de seguridad e inteligencia (PGR, FGR, Ciberseguridad);
    entidades financieras y regulatorias (BANDESAL, ISP, SIGET); Instituto Salvadoreño
    de Formación Profesional (ISTA); Presidencia de la República y Asamblea Legislativa;
    municipalidades y OPAMSS.

    **Patrones no obvios relevantes:** Procesos descritos vagamente como "adquisición
    de equipos informáticos" frecuentemente incluyen componentes de infraestructura
    crítica como respaldo energético, redundancia de sistemas y modernización integral,
    no solo hardware básico. Términos como "conectividad de sitios públicos" encubren
    proyectos de expansión de red más complejos. Licitaciones con denominaciones genéricas
    de "mantenimiento preventivo y correctivo" pueden involucrar licenciamiento de
    software especializado o servicios de ciberseguridad. La presencia de "certificados
    digitales" y "servicios de respaldo" en procesos tecnológicos sugiere que el estado
    busca soluciones de continuidad operativa.

    **Tipos de procesos NO relevantes:** Aunque suenan tecnológicos, procesos puramente
    de telecomunicaciones (servicios de telefonía, conectividad de ISP como proveedor
    externo), proyectos de infraestructura física sin componente informático (cableado
    estructurado sin sistemas activos), licitaciones de soporte técnico genérico ofrecido
    por integradores especializados sin suministro de equipos, y procesos de consultoría
    TI sin entrega de activos tecnológicos tangibles.
