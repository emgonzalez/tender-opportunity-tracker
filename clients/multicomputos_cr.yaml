    excluirse procesos claramente NO tecnológicos (alimentos, construcción civil,
    vehículos, seguros, etc.). TBD: validar con datos reales del portal si las instituciones
    de Costa Rica también asignan categorías incorrectas (en El Salvador sí, y por
    eso se analiza el TEXTO de la descripción y no la categoría del sistema); mientras
    tanto, analiza siempre el texto.'
