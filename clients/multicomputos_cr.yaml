        - Centro de operaciones de seguridad SOC (Cyrebro)
        - Gestión de identidad y acceso IAM (Okta SSO, MFA)
        - Autenticación digital y prevención de fraude (Onespan)
        - Firma electrónica y onboarding digital (Onespan)
