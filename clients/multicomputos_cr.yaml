# Client Profile — Multicómputos Costa Rica
#
# Copia del perfil de El Salvador (clients/multicomputos.yaml): mismas marcas, categorías, etiquetas y
# señales de inclusión/exclusión (Costa Rica compite con el mismo portafolio). Si el catálogo cambia en un
# país, hay que replicarlo en el otro a mano; no se comparte por referencia.
#
# INACTIVO a propósito (`active: false`): falta el extractor del portal (SICOP, todavía TBD) y las
# credenciales de acceso, que se están gestionando. Antes de activarlo: ver
# docs/planes/multicomputos-costa-rica.md.
# Para generar `intelligence`: python -m src.classifier.trainer --client multicomputos_cr
# (solo cuando haya historial de procesos de Costa Rica). NO editar la sección intelligence manualmente.

client:
  id: multicomputos_cr
  name: Multicómputos Costa Rica
  description: >-
    Integrador de soluciones empresariales de TI con 17+ partnerships de marca,
    especializado en infraestructura, ciberseguridad, virtualización, cloud y
    servicios profesionales para el sector público y privado de Centroamérica y el Caribe
  portal: sicop_cr   # TBD: portal por confirmar; hoy sin extractor
  active: false

