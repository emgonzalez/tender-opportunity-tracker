rules:
  context_note: >-
    CRITERIO DE RELEVANCIA: Cualquier proceso relacionado con tecnología de la información
    es potencialmente relevante para Multicómputos, incluyendo pero no limitado a:
    software de seguridad (antivirus, endpoint protection, licencias de seguridad),
    hardware informático (memorias, componentes, equipos de cómputo), licenciamiento
    de software, servicios de TI, infraestructura, ciberseguridad, redes, y en general
    cualquier adquisición del ámbito tecnológico/informático.
    El portafolio principal se centra en infraestructura empresarial, ciberseguridad,
    virtualización, cloud y servicios profesionales, pero Multicómputos puede participar
    y competir en cualquier licitación tecnológica del sector público.
    Solo deben excluirse procesos claramente NO tecnológicos (alimentos, construcción civil,
    vehículos, seguros, etc.).
    TBD: validar con datos reales del portal si las instituciones de Costa Rica también
    asignan categorías incorrectas (en El Salvador sí, y por eso se analiza el TEXTO de la
    descripción y no la categoría del sistema); mientras tanto, analiza siempre el texto.

  categories: infraestructura, cloud_db, virtualizacion, redes, ciberseguridad, observabilidad, proteccion_datos, servicios_ti, otro

classification:
  relevance_threshold: 0.6
  confidence_threshold: 0.7

