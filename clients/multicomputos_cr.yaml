    - id: ciberseguridad
      label: Ciberseguridad
      items:
        - Seguridad de red y firewalls (Fortinet FortiGate, FortiSwitch, FortiAP)
        - Secure SD-Branch (Fortinet)
        - Protección de aplicaciones web y APIs (Imperva WAF)
