        - id: cyrebro
          name: Cyrebro
          products: [SOC as a Service, monitoreo de seguridad, detección de amenazas]
        - id: okta
          name: Okta
          products: [SSO, MFA, gestión de identidades, IAM]
        - id: onespan
          name: Onespan
          products: [firma digital, autenticación, prevención de fraude, onboarding digital]
        - id: teramind
          name: Teramind
          products: [monitoreo de usuarios, DLP, detección de amenazas internas]

    - id: observabilidad
