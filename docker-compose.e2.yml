services:
  amalia:
    # Imagen prearmada por CI, no build local. La etiqueta la fija oci/lib/04-app.sh
    # en el .env de la VM apuntando a un SHA concreto, así desplegar es elegir un
    # commit y volver atrás es cambiar esa línea.
    #
    # Por qué dejó de construirse acá: un E2.1.Micro tiene 1 GB de RAM, y armar
    # esta imagen (Playwright + Chromium) tardaba varios minutos compitiendo con
    # el swap. El build es justo el momento de mayor presión de memoria del
    # despliegue, y no hay ninguna razón para pagarlo en la VM más chica cuando un
    # runner de CI ya la construyó y la verificó.
    #
    # Sin `build:` a propósito: la ausencia de esa clave es lo que 04-app.sh lee
    # para saber que este despliegue baja la imagen en vez de construirla. La
    # variante ARM (docker-compose.oci.yml) la conserva y por eso sigue construyendo.
    image: ${AMALIA_IMAGE:?falta AMALIA_IMAGE — lo escribe oci/lib/04-app.sh al desplegar; para uso local, exportalo o usá docker-compose.yml}
    container_name: amalia
    init: true
    shm_size: '128m'                  # Chromium en RAM apretada (1 GB total host)
    env_file: .env
    environment:
      - LOW_MEMORY_MODE=true          # Activa flags low-memory en chromium.launch (src/scraper/browser.py)
    volumes:
      - ./data:/app/data
      - ./clients:/app/clients:ro     # Dockerfile x86 no hace COPY clients/ — se monta como volumen
    # Sin restart policy: el container se levanta una sola vez al día con
    # `docker compose run --rm` desde el systemd timer, y termina al salir.
    mem_limit: 800m                   # Deja ~200 MB al sistema + swap como respaldo
    memswap_limit: 8800m              # Permite usar hasta 8 GB de swap (host swap = 8 GB)
    oom_score_adj: 1000               # Si el kernel hace OOM-kill, este container muere antes que el resto
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Servicio web residente (ADR 0005, Fase 2) ───────────────────────────────
  # Los dos servicios de abajo NO los toca el timer diario (`docker compose run
  # --rm amalia`): los levanta oci/lib/08-web.sh con `up -d web caddy`, solo si el
  # tenant declara `web.enabled`. Sin eso este archivo se comporta como siempre.
  web:
    image: ${AMALIA_IMAGE:?falta AMALIA_IMAGE — lo escribe oci/lib/04-app.sh al desplegar; para uso local, exportalo o usá docker-compose.yml}
    container_name: amalia-web
    init: true
    command: ["python", "-m", "src.web"]
    env_file: .env
    environment:
      - FEEDBACK_PORT=8080
    volumes:
      - ./data:/app/data
      - ./clients:/app/clients:ro
    restart: unless-stopped
    # El host ya vive al filo (ver `amalia` arriba). Tope propio y oom_score_adj
    # por debajo del de `amalia` (1000): si hay OOM, muere primero la corrida
    # diaria y no el endpoint que reciben los clics de los correos.
    mem_limit: 160m
    oom_score_adj: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: amalia-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"     # desafío HTTP-01 de Let's Encrypt y redirección a HTTPS
      - "443:443"
    environment:
      - WEB_HOSTNAME=${WEB_HOSTNAME:-}
    volumes:
      - ./oci/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Los certificados persisten: re-emitirlos en cada recreación agotaría los
      # límites de Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    oom_score_adj: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
