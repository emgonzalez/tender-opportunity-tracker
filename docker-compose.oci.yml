services:
  tender-opportunity-tracker:
    build:
      context: .
      dockerfile: Dockerfile.oci
    container_name: tender-opportunity-tracker
    init: true
    shm_size: '256m'
    env_file: .env
    volumes:
      - ./data:/app/data
    # Sin restart policy: modelo ephemeral — el systemd timer dispara
    # `docker compose run --rm` a las 07:00 hora El Salvador.
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
