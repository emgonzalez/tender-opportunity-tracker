# Configuración de tenants OCI
#
# Los OCIDs no son secretos (aparecen en URLs y logs de OCI). Las credenciales
# (claves API, fingerprints) NO van aquí — viven en ~/.oci/config bajo el
# perfil que cada tenant referencia.
#
# Para agregar un tenant:
#   1. Crea un perfil en ~/.oci/config con sus credenciales
#   2. Agrega una entrada aquí con su OCID, region, compartment y shape
#
# ── Por qué hay un solo tenant ───────────────────────────────────────────────
# El 2026-09-20 se eliminaron tres entradas, cada una por su motivo:
#   · `emiliogonzalez` y `emiliogonzalez_e2` — su infraestructura se destruyó ese
#     mismo día (VCN, VM, la ADB AMALIAE2, buckets, budgets, policies). Eran los
#     tenants personales de validación y ya no existen en OCI.
#   · `multicomputos` — su infraestructura se había eliminado el 2026-09-08 y el
#     bloque quedó como plantilla de la futura producción. Mantener una plantilla
#     que nadie despliega tiene un costo real: `deploy.sh <tenant>` la acepta
#     como destino válido, y un archivo que describe recursos inexistentes se lee
#     como si existieran. Cuando haga falta AMALIA_PROD, la plantilla es
#     `multicomputos_dev` — que sí está desplegado y verificado.
#
# ── SSH: por qué `ssh_ingress_cidr: auto` y no un /32 escrito acá ────────────
# `auto` significa "el /32 de quien está desplegando, averiguado en el momento".
# Un /32 literal en este archivo sería peor por dos razones:
#   · La IP del operador es residencial y DINÁMICA: el valor nace vencido, y un
#     redeploy pisaría con esa IP vieja el /32 correcto que dejó ssh-allow.sh.
#     El paso siguiente del deploy entra por SSH — se colgaría contra su propia
#     regla.
#   · Sería la IP de casa de una persona, versionada en git para siempre.
# Cómo se refresca sin desplegar, cuando cambia la IP:  oci/scripts/ssh-allow.sh
# Cómo se resuelve el valor:                            oci/lib/ssh-cidr.sh
# Valores aceptados: `auto` · un CIDR IPv4 fijo (`1.2.3.4/32`) · `0.0.0.0/0`
# (se acepta por compatibilidad pero avisa a los gritos: es el agujero que la
# Fase 7 vino a cerrar).

tenants:
  multicomputos_dev:
    description: >-
      Tenant corporativo — ambiente DEV en compartment AMALIA_DEV (Landing
      Zone MC_Internal_Apps/AMALIA). Precede a multicomputos_prod → AMALIA_PROD.
      Feature flags completos: Track A (drilldown) + Track B (memoria en ADB).
    profile: MULTICOMPUTOS
    notification:
      override_to: emiliogonzalez777@gmail.com
    features:
      enable_drilldown: true
      enable_memoria: true
      # 2026-09-23: pasa a `oci` por decisión del operador, para medir el costo
      # real de OCI contra el de Claude con tráfico de verdad. La prueba de humo
      # de ese día, con el perfil MULTICOMPUTOS y este compartment, pasó los
      # cinco gates en us-chicago-1: auth, lectura de imágenes base64, +37,6 MB
      # de RSS del SDK (entra en los 800m de la E2.1.Micro) y 5,49 chars/token.
      #
      # ⚠️ ESTO ENCIENDE GASTO y este tenant es el que MENOS red tiene:
      # `budget.enabled: false` y `auto_stop: false`, unos renglones más abajo.
      # Quien vigila el gasto mientras tanto es `DAILY_BUDGET_USD` dentro de la
      # app (src/drilldown/quota.py), no OCI. La guardia de OCI sigue apagada.
      #
      # Para volver a Claude: `anthropic` acá y redesplegar. No hay otro paso —
      # ése es el punto de la abstracción.
      llm_provider: oci
      # Familia de modelos dentro de OCI (ver la nota larga en `emiliogonzalez`).
      # Éste es también el tenant donde se van a comparar las tres familias en el
      # E2E, y aun así arranca en `nativo`: es la única que mantiene los pliegos
      # DENTRO de OCI. Pasarlo a "xai" o "google" manda el contenido de los
      # pliegos a servidores de xAI o de Google — decisión de gobernanza del
      # dato, no de performance.
      oci_familia: nativo
      # Libro append-only del consumo: una línea por llamada al modelo, con
      # tokens, caracteres, latencia y truncamiento. Es lo que hace posible la
      # comparación contra Claude, y solo sirve si ya estaba encendido ANTES de
      # que hubiera tráfico que medir. Registra tamaños, nunca contenido.
      llm_registro_habilitado: true
    tenancy_ocid: ocid1.tenancy.oc1..aaaaaaaam27oy6k4gep2ltobrj3gsgcif73tqdvox3suykxlastvq2ctshxq
    region: us-ashburn-1
    compartment_ocid: ocid1.compartment.oc1..aaaaaaaanhp32bzkqu4u2g626rtlsbtczsv65cbf6bkztpvgawxmwdco32pa  # AMALIA_DEV
    free_tier: true
    instance:
      display_name: tender-opportunity-tracker-dev
      shape: VM.Standard.E2.1.Micro
      boot_volume_size_gb: 50
      os: Canonical Ubuntu
      os_version: "22.04"
      ephemeral_container: true
      schedule_time: "07:00"
      swap_size_gb: 8
      zram_percent: 50
      earlyoom: true
      swappiness: 100
    network:
      vcn_cidr: 10.20.0.0/16
      subnet_cidr: 10.20.0.0/24
      # ⚠️ Esta VM está VIVA. El cambio de 0.0.0.0/0 a `auto` recién surte efecto
      # cuando se vuelva a correr el deploy o `oci/scripts/ssh-allow.sh`; hasta
      # entonces el 22 sigue como está. Ver la nota de la cabecera.
      ssh_ingress_cidr: auto
      dns_prefix: amaliadev
    docker:
      compose_file: docker-compose.e2.yml
      # ── channel: auto-actualización de la imagen (opt-in) ──────────────────
      # Ausente = la VM se queda en el SHA que le dejó el último deploy y solo
      # cambia cuando una persona vuelve a desplegar (el comportamiento de
      # siempre). Con un canal —una etiqueta móvil que publica CI: 'develop',
      # 'main', 'latest'— la VM se actualiza sola 90 min antes de la corrida
      # diaria, sin que nadie tenga que alcanzarla por SSH.
      # Lo que queda en el .env sigue siendo un sha-<40hex>, así que `--version`
      # sigue respondiendo qué commit produjo el reporte de esta mañana.
      # Cómo funciona: oci/README.md § De dónde sale la imagen (pull vs build).
      # Este tenant es el candidato natural para estrenarlo (es DEV), pero se
      # deja apagado hasta validarlo:
      # channel: develop
    budget:
      enabled: false
      threshold_usd: 0.01
      alert_email: emilio.gonzalez@multicomputos.com
      auto_stop: false
    adb:
      enabled: true
      display_name: amalia-adb-dev
      db_name: AMALIADEV
      workload: OLTP
      is_free_tier: true
    # ── Respaldo verificado del historial (Fase 5) ────────────────────────────
    # Provisionar con: source oci/lib/common.sh && source oci/lib/07-backup.sh
    #                  && backup_setup multicomputos_dev
    # Crea el bucket en el compartment de este tenant (AMALIA_DEV), le pone la
    # política de retención, emite el PAR y lo instala en la VM. Inerte hasta
    # que se corra: `enabled: true` acá solo hace que el cloud-init de una VM
    # NUEVA traiga el script y las units (con el timer apagado hasta que haya PAR).
    backup:
      enabled: true
      # 09:00, dos horas después de la corrida de las 07:00. La corrida tiene
      # TimeoutStartSec=30min y puede reintentar una hora después, así que 09:00
      # deja margen; y si aun así se solapara, el script espera a que termine
      # antes de tomar el snapshot en vez de capturar estado a medio escribir.
      schedule_time: "09:00"
    tags:
      project: tender-opportunity-tracker
      managed-by: oci-deploy-script
      environment: dev
      cost-tier: free
