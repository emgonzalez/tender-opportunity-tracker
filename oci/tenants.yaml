# Configuración de tenants OCI
#
# Los OCIDs no son secretos (aparecen en URLs y logs de OCI). Las credenciales
# (claves API, fingerprints) NO van aquí — viven en ~/.oci/config bajo el
# perfil que cada tenant referencia.
#
# Para agregar un tenant:
#   1. Crea un perfil en ~/.oci/config con sus credenciales
#   2. Agrega una entrada aquí con su OCID, region, compartment y shape
#
# ── Por qué hay un solo tenant ───────────────────────────────────────────────
# El 2026-09-20 se eliminaron tres entradas, cada una por su motivo:
#   · `emiliogonzalez` y `emiliogonzalez_e2` — su infraestructura se destruyó ese
#     mismo día (VCN, VM, la ADB AMALIAE2, buckets, budgets, policies). Eran los
#     tenants personales de validación y ya no existen en OCI.
#   · `multicomputos` — su infraestructura se había eliminado el 2026-09-08 y el
#     bloque quedó como plantilla de la futura producción. Mantener una plantilla
#     que nadie despliega tiene un costo real: `deploy.sh <tenant>` la acepta
#     como destino válido, y un archivo que describe recursos inexistentes se lee
#     como si existieran. Cuando haga falta AMALIA_PROD, la plantilla es
#     `multicomputos_dev` — que sí está desplegado y verificado.
#
# ── SSH: por qué `ssh_ingress_cidr: auto` y no un /32 escrito acá ────────────
# `auto` significa "el /32 de quien está desplegando, averiguado en el momento".
# Un /32 literal en este archivo sería peor por dos razones:
#   · La IP del operador es residencial y DINÁMICA: el valor nace vencido, y un
#     redeploy pisaría con esa IP vieja el /32 correcto que dejó ssh-allow.sh.
#     El paso siguiente del deploy entra por SSH — se colgaría contra su propia
#     regla.
#   · Sería la IP de casa de una persona, versionada en git para siempre.
# Cómo se refresca sin desplegar, cuando cambia la IP:  oci/scripts/ssh-allow.sh
# Cómo se resuelve el valor:                            oci/lib/ssh-cidr.sh
# Valores aceptados: `auto` · un CIDR IPv4 fijo (`1.2.3.4/32`) · `0.0.0.0/0`
# (se acepta por compatibilidad pero avisa a los gritos: es el agujero que la
# Fase 7 vino a cerrar).

tenants:
  multicomputos_dev:
    description: >-
      Tenant corporativo — ambiente DEV en compartment AMALIA_DEV (Landing
      Zone MC_Internal_Apps/AMALIA). Precede a multicomputos_prod → AMALIA_PROD.
      Feature flags completos: Track A (drilldown) + Track B (memoria en ADB).
    profile: MULTICOMPUTOS
    notification:
      override_to: emiliogonzalez777@gmail.com
    features:
      enable_drilldown: true
      enable_memoria: true
      # 2026-09-23: pasa a `oci` por decisión del operador, para medir el costo
      # real de OCI contra el de Claude con tráfico de verdad. La prueba de humo
      # de ese día, con el perfil MULTICOMPUTOS y este compartment, pasó los
      # cinco gates en us-chicago-1: auth, lectura de imágenes base64, +37,6 MB
      # de RSS del SDK (entra en los 800m de la E2.1.Micro) y 5,49 chars/token.
      #
      # ⚠️ ESTO ENCIENDE GASTO y este tenant es el que MENOS red tiene:
      # `budget.enabled: false` y `auto_stop: false`, unos renglones más abajo.
      # Quien vigila el gasto mientras tanto es `DAILY_BUDGET_USD` dentro de la
      # app (src/drilldown/quota.py), no OCI. La guardia de OCI sigue apagada.
      #
      # Para volver a Claude: `anthropic` acá y redesplegar. No hay otro paso —
      # ése es el punto de la abstracción.
      llm_provider: oci
      # Familia de modelos dentro de OCI (ver la nota larga en `emiliogonzalez`).
      # Éste es también el tenant donde se van a comparar las tres familias en el
      # E2E, y aun así arranca en `nativo`: es la única que mantiene los pliegos
      # DENTRO de OCI. Pasarlo a "xai" o "google" manda el contenido de los
      # pliegos a servidores de xAI o de Google — decisión de gobernanza del
      # dato, no de performance.
      oci_familia: nativo
      # Libro append-only del consumo: una línea por llamada al modelo, con
      # tokens, caracteres, latencia y truncamiento. Es lo que hace posible la
      # comparación contra Claude, y solo sirve si ya estaba encendido ANTES de
      # que hubiera tráfico que medir. Registra tamaños, nunca contenido.
      llm_registro_habilitado: true
    tenancy_ocid: ocid1.tenancy.oc1..aaaaaaaam27oy6k4gep2ltobrj3gsgcif73tqdvox3suykxlastvq2ctshxq
    region: us-ashburn-1
    compartment_ocid: ocid1.compartment.oc1..aaaaaaaanhp32bzkqu4u2g626rtlsbtczsv65cbf6bkztpvgawxmwdco32pa  # AMALIA_DEV
    free_tier: true
    instance:
      display_name: tender-opportunity-tracker-dev
      shape: VM.Standard.E2.1.Micro
      boot_volume_size_gb: 50
      os: Canonical Ubuntu
      os_version: "22.04"
      ephemeral_container: true
      schedule_time: "07:00"
      swap_size_gb: 8
      zram_percent: 50
      earlyoom: true
      swappiness: 100
    network:
      vcn_cidr: 10.20.0.0/16
      subnet_cidr: 10.20.0.0/24
      # ⚠️ Esta VM está VIVA. El cambio de 0.0.0.0/0 a `auto` recién surte efecto
      # cuando se vuelva a correr el deploy o `oci/scripts/ssh-allow.sh`; hasta
      # entonces el 22 sigue como está. Ver la nota de la cabecera.
      ssh_ingress_cidr: auto
      dns_prefix: amaliadev
    docker:
      compose_file: docker-compose.e2.yml
      # ── channel: auto-actualización de la imagen (opt-in) ──────────────────
      # Ausente = la VM se queda en el SHA que le dejó el último deploy y solo
      # cambia cuando una persona vuelve a desplegar (el comportamiento de
      # siempre). Con un canal —una etiqueta móvil que publica CI: 'develop',
      # 'main', 'latest'— la VM se actualiza sola 90 min antes de la corrida
      # diaria, sin que nadie tenga que alcanzarla por SSH.
      # Lo que queda en el .env sigue siendo un sha-<40hex>, así que `--version`
      # sigue respondiendo qué commit produjo el reporte de esta mañana.
      # Cómo funciona: oci/README.md § De dónde sale la imagen (pull vs build).
      # Este tenant es el candidato natural para estrenarlo (es DEV), pero se
      # deja apagado hasta validarlo:
      # channel: develop
    budget:
      enabled: true
      # $0.01 fue un valor de prueba que nunca se corrigió. Subido a $50 el
      # 2026-09-29 tras medir gasto real de AMALIA_DEV ese mes ($0.79, con
      # LLM_PROVIDER=oci) — ~63x de margen sobre el gasto normal, bajo como
      # para frenar un runaway real (bug en drill-down, loop de reintentos).
      threshold_usd: 50
      alert_email: emilio.gonzalez@multicomputos.com
      # Activado 2026-09-28: José Corrales creó a mano el dynamic group + policy
      # del Bloque D (PERMISOS-IAM.md) en la raíz de la tenancy, y agregó
      # `inspect dynamic-groups in tenancy` al grupo operador — con eso
      # 03-budget.sh detecta estos nombres (no los default `tot-<tenant>-*`) y
      # NO intenta crearlos (seguiría sin tener `manage dynamic-groups in tenancy`).
      auto_stop: true
      dynamic_group_name: Dynamic_group_watchdog_de_costo_amalia
      policy_name: amalia_dev_watchdog_policy
    adb:
      enabled: true
      display_name: amalia-adb-dev
      db_name: AMALIADEV
      workload: OLTP
      is_free_tier: true
      # Mismo caso que budget.* arriba: creados a mano por José el 2026-09-28.
      dynamic_group_name: Dynamic_group_acceso_a_la_ADB_amalia
      policy_name: amalia_dev-adb-access-policy
    # ── Respaldo verificado del historial (Fase 5) ────────────────────────────
    # Provisionar con: source oci/lib/common.sh && source oci/lib/07-backup.sh
    #                  && backup_setup multicomputos_dev
    # Crea el bucket en el compartment de este tenant (AMALIA_DEV), le pone la
    # política de retención, emite el PAR y lo instala en la VM. Inerte hasta
    # que se corra: `enabled: true` acá solo hace que el cloud-init de una VM
    # NUEVA traiga el script y las units (con el timer apagado hasta que haya PAR).
    backup:
      enabled: true
      # 09:00, dos horas después de la corrida de las 07:00. La corrida tiene
      # TimeoutStartSec=30min y puede reintentar una hora después, así que 09:00
      # deja margen; y si aun así se solapara, el script espera a que termine
      # antes de tomar el snapshot en vez de capturar estado a medio escribir.
      schedule_time: "09:00"
    tags:
      project: tender-opportunity-tracker
      managed-by: oci-deploy-script
      environment: dev
      cost-tier: free

  # ── multicomputos_dev_a1 — Fase M: migración a Ampere A1.Flex ────────────────
  # NO es un tenant nuevo de producción: es la MISMA app, en una VM más grande,
  # mientras dura la migración de multicomputos_dev (E2.1.Micro, 1 GB) a esta
  # A1 (4 OCPU / 24 GB). Ver docs/decisiones/0006-migracion-a-a1.md.
  #
  # ── Qué comparte con multicomputos_dev, y qué NO ────────────────────────────
  #   · Red (network.share_from): SÍ. Reusa VCN/IGW/Route Table/Security List —
  #     el SSH de los dos lo gobierna la MISMA regla, así que `ssh-allow.sh
  #     multicomputos_dev` (no hace falta correrlo para este tenant también)
  #     alcanza para las dos VMs.
  #   · ADB (bloque `adb:`): a propósito, NO tiene uno propio. Este tenant NO
  #     declara adb_ocid en su state, así que su propio `adb_acl_sync` es un
  #     no-op total — la ADB sigue siendo enteramente de multicomputos_dev
  #     mientras dura la migración. La entrada nueva a la ACL para esta VM se
  #     agrega A MANO en M3 (`ociq db autonomous-database update
  #     --whitelisted-ips [...]`, ver oci/README.md), y el fix de la Fase M a
  #     `adb_acl_sync` (agrega en vez de reemplazar) es lo que garantiza que un
  #     redeploy normal de multicomputos_dev no la borre sin querer mientras
  #     tanto.
  #   · Presupuesto/features/notification: NO se heredan (share_from solo
  #     comparte red) — están repetidos abajo, con las diferencias que importan
  #     para la sombra: enable_memoria en false.
  #
  # ── Por qué 4 OCPU / 24 GB y no una forma más chica ──────────────────────────
  # La cuota Always Free de A1 está en conflicto entre dos fuentes oficiales de
  # Oracle: la página de recursos dice 2 OCPU/12 GB; la lista de precios
  # (SKU B93297/B93298) da un tramo gratis de 3000 OCPU-h/18000 GB-h, que
  # equivale a 4/24 corriendo 24×7. Decisión explícita: arrancar en 4/24 y
  # asumir el riesgo de pagar el excedente si la documentación resulta ser la
  # correcta (peor caso ≈ $27,74/mes — ver el ADR). La facturación es mensual
  # acumulada: no se nota en una prueba corta. Alarma de presupuesto pendiente
  # de crear a mano en la consola (Cost Management → Budgets) mientras no haya
  # script para eso en oci/lib/.
  multicomputos_dev_a1:
    description: >-
      Fase M — migración de multicomputos_dev a Ampere A1.Flex. Mientras dura,
      corre EN SOMBRA junto a la E2 original: mismo código, mismo ADB (leído
      con enable_memoria=false), sin timer propio hasta el corte (M4).
    profile: MULTICOMPUTOS
    notification:
      # No se hereda de multicomputos_dev (share_from solo comparte red):
      # mismo destino que la producción real, así ningún correo de prueba de
      # este tenant llega jamás a un destinatario real mientras esté en sombra.
      override_to: emiliogonzalez777@gmail.com
    features:
      enable_drilldown: true
      # false a propósito durante toda la migración en sombra (M3): sin esto,
      # la corrida de este tenant escribiría en la MISMA ADB que ya escribe
      # multicomputos_dev todos los días, duplicando y pisando estado real. Se
      # enciende recién en el corte (M4), cuando la E2 ya esté detenida.
      enable_memoria: false
      llm_provider: oci
      oci_familia: nativo
      # Encendido para poder comparar el consumo de esta VM contra el de la E2
      # corrida a corrida durante la sombra (M3). Escribe en el JSONL local de
      # ESTA VM, no en la ADB — no lo bloquea enable_memoria=false.
      llm_registro_habilitado: true
    tenancy_ocid: ocid1.tenancy.oc1..aaaaaaaam27oy6k4gep2ltobrj3gsgcif73tqdvox3suykxlastvq2ctshxq
    region: us-ashburn-1
    compartment_ocid: ocid1.compartment.oc1..aaaaaaaanhp32bzkqu4u2g626rtlsbtczsv65cbf6bkztpvgawxmwdco32pa  # AMALIA_DEV
    free_tier: true
    instance:
      display_name: tender-opportunity-tracker-a1
      shape: VM.Standard.A1.Flex
      ocpus: 4
      memory_gb: 24
      # 50 (E2) + 100 (esta) = 150 GB, dentro de los 200 GB de Always Free
      # entre TODAS las VMs de la tenancy — no hace falta liberar nada todavía.
      boot_volume_size_gb: 100
      os: Canonical Ubuntu
      os_version: "22.04"
      ephemeral_container: true
      schedule_time: "07:00"
      # Sin swap_size_gb/zram_percent/earlyoom/swappiness: eran para los 800 MB
      # de la E2. Con 24 GB, render-cloud-init.sh los omite solo con no ponerlos
      # (default off) — no hay una clave "false" que poner, es la ausencia.
      #
      # hold_timers: mientras este tenant esté en sombra (M3), NINGÚN redeploy
      # debe encender `amalia.timer` por sí solo — la corrida diaria la sigue
      # disparando la E2. `04-app.sh` lo lee y deja el timer apagado a
      # propósito en cada despliegue. Se borra esta clave (o se pone en false)
      # en el corte de M4, cuando SÍ se quiere que el timer quede activo.
      hold_timers: true
    network:
      share_from: multicomputos_dev
      # Distinto del 10.20.0.0/24 de multicomputos_dev; ambos dentro del MISMO
      # VCN CIDR (10.20.0.0/16) que ya existe, no se declara vcn_cidr acá.
      subnet_cidr: 10.20.1.0/24
      ssh_ingress_cidr: auto
      dns_prefix: amaliaa1
    docker:
      compose_file: docker-compose.a1.yml
    budget:
      enabled: false
      threshold_usd: 0.01
      alert_email: emilio.gonzalez@multicomputos.com
      auto_stop: false
    # Sin bloque `adb:` — ver la nota grande de arriba: a propósito, este
    # tenant no tiene ADB propia mientras dure la migración.
    #
    # Sin bloque `backup:` todavía: `backup_setup` se corre en el corte (M4),
    # no antes — no tiene sentido respaldar el historial de una VM en sombra
    # que todavía puede desecharse si la comparación con la E2 no cierra.
    tags:
      project: tender-opportunity-tracker
      managed-by: oci-deploy-script
      environment: dev
      cost-tier: free
      phase: migracion-a1
