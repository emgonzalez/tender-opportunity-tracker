[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-opportunity-tracker"
version = "0.1.0"
description = "AMALIA — agente de monitoreo y clasificación de licitaciones COMPRASAL"
requires-python = ">=3.11"

# Pines exactos heredados de requirements.txt: este archivo es ahora el ÚNICO
# hogar autoritativo de las dependencias (CLAUDE.md, regla de oro). Los
# Dockerfiles instalan desde aquí.
dependencies = [
    "playwright==1.50.0",
    "anthropic==0.49.0",
    "pyotp==2.9.0",
    "APScheduler==3.10.4",
    "Jinja2==3.1.4",
    "python-dotenv==1.0.1",
    "pydantic==2.10.6",
    "tenacity==9.0.0",
    "pyyaml==6.0.2",
    "pymupdf==1.24.10",
    "requests==2.32.3",
    # Track B — memoria institucional. Modo THIN (Python puro): NO requiere
    # Oracle Instant Client (~200 MB), inviable en la VM de 1 GB. VECTOR desde 2.2+.
    "oracledb==4.0.2",
]

[project.optional-dependencies]
# Sin pytest-asyncio: hoy no hay ningún test async en la suite. Agregarlo el día
# que lo haya, no antes.
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

# SDK de OCI: solo hace falta con LLM_PROVIDER=oci, y por eso vive acá afuera y
# no en `dependencies`. El costo está medido, no estimado:
#
#   · +39-42 MB de RSS al hacer `import oci`  (smoke de Tanda 0, 2026-09-19)
#   · 468 MB instalado en site-packages, que en la imagen x86 son
#     +405 MB (2543 → 2948 MB, medido con docker build --build-arg INSTALL_OCI)
#
# Ojo con ese segundo número: el plan lo estimaba en ~100 MB y la medición dice
# cuatro veces más. Son los clientes generados de TODOS los servicios de OCI —se
# instala el SDK entero para usar un solo endpoint de inferencia— más
# cryptography, pyOpenSSL y aiohttp. La VM de producción es una E2.1.Micro de
# 1 GB con `mem_limit: 800m` y Chromium al lado: el RSS entra cómodo, pero nada
# de esos 405 MB se paga hasta que alguien elija el proveedor.
#
# A propósito NO está dentro de `dev`: el extra `dev` es el "setup de la laptop"
# y ya se usa así (docs/planes/fase8-evaluacion.md). CI pide `.[dev,oci]`
# explícitamente, que consigue lo mismo —los tests del adaptador corren con el
# SDK de verdad— sin cobrarle 468 MB a quien solo quiere correr la suite. Los
# tests puros del traductor no importan `oci`; los que sí lo necesitan llevan
# `pytest.importorskip("oci")`, y ese skip solo significa algo si existe un
# entorno legítimo donde el SDK falte.
#
# Pin 2.183.0 y no el `latest` (2.186.0): es la versión con la que se corrió el
# smoke de Tanda 0 y contra la que se midieron el RSS, el tope de 4096 y la
# calibración de 5,5 chars/token. Subirlo es una decisión con evidencia, no un
# efecto colateral de instalar.
oci = [
    "oci==2.183.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# La raíz del repo, explícita en sys.path. Sin esto la suite solo pasa cuando se
# invoca como `python -m pytest` (que inyecta el CWD) y falla al llamar al
# binario `pytest` directamente — que es como la va a llamar CI. Hace falta
# porque tests/test_calibracion.py y test_medicion.py importan de `scripts/`,
# que son utilidades de línea de comandos, no un paquete instalable.
pythonpath = ["."]
# Declarados para que `--strict-markers` no haga falta y para que un marker mal
# escrito se vea: sin esto, `pytest.mark.integraton` no seleccionaría nada y no
# avisaría. Los dos existentes ya se usaban sin declarar (warning en cada corrida).
markers = [
    "integration: necesita infraestructura externa; se salta solo si no está.",
    "oracle_local: necesita el Oracle 23ai de db/docker-compose.oracle.yml.",
]

[tool.ruff]
line-length = 100
# py311 y no py312 aunque las imágenes corran 3.12: mantiene honesto el
# `requires-python = ">=3.11"` — ruff marca sintaxis que rompería en 3.11.
target-version = "py311"

[tool.ruff.lint]
# Conjunto EXPLÍCITO, no el default de ruff: el default cambia entre versiones y
# un `ruff>=0.5` que se actualice solo rompería CI sin que nadie tocara el código.
#
#   E4/E7/E9 · errores de pycodestyle que importan (imports, sintaxis)
#   F        · pyflakes — bugs reales: imports sin usar, nombres indefinidos
#   I        · orden de imports, auto-corregible
#
# Deliberadamente FUERA por ahora, para no convertir la adopción de linter en una
# refactorización: BLE001 (except desnudo, 21 casos), DTZ (datetime sin tzinfo,
# 9 casos — relevante porque AMALIA es sensible a la zona horaria), TRY401, S110,
# UP, SIM, FURB, PIE. Ampliar el select familia por familia, cada una con su
# propio commit y su propia revisión.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Los scripts de validación son ejecutables sueltos, no módulos importables:
# insertan la raíz del repo en sys.path y solo DESPUÉS pueden importar `src.*`.
# El import a media altura no es descuido, es la única forma de que funcionen
# invocados directamente (`python scripts/validate_tracka_e2e.py`).
"scripts/*.py" = ["E402"]
