<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block titulo %}Portal AMALIA{% endblock %}</title>
  <style>
    /* Tokens: claro = paleta de la maqueta y del correo; oscuro = los mismos matices aclarados
       (contraste >= 4,5:1 sobre --superficie). Fuera de este bloque no hay colores fijos. */
    :root {
      color-scheme: light dark;
      --fondo: #F3F1EC; --superficie: #FFFFFF; --borde: #E2DED3; --col: #ECE9E1; --neutro: #B9B4A8;
      --texto: #18181A; --texto2: #5C584F; --muted: #6F6B62;
      --serie: #1F3A5F; --bueno: #2E7D4F; --critico: #A33A2A; --aviso: #8A6D1F;
      --sobre-serie: #FFFFFF; --radio: 2px;
      --rampa-0: #C9D7E8; --rampa-1: #A9BFDB; --rampa-2: #8AA5C8; --rampa-3: #6B8AB3;
      --rampa-4: #4E6F9C; --rampa-5: #3A5883; --rampa-6: #2B476F; --rampa-7: #1F3A5F;
      --chip-rojo-bg: #F6E1DC; --chip-rojo-fg: #8A2A1C; --chip-rojo-bd: #E9BFB6;
      --chip-ambar-bg: #F4EACB; --chip-ambar-fg: #6B531A; --chip-ambar-bd: #E6D9A8;
      --chip-verde-bg: #E4F1E9; --chip-verde-fg: #1F5C39; --chip-verde-bd: #BFDDCB;
      --chip-azul-bg: #E4ECF5; --chip-azul-fg: #1F3A5F; --chip-azul-bd: #C9D7E8;
      --chip-crema-bg: #F3F1EC; --chip-crema-fg: #4A463F; --chip-crema-bd: #E2DED3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #141413; --superficie: #1D1D1B; --borde: #2C2C2A; --col: #0F0F0E; --neutro: #4A4943;
        --texto: #F2F1ED; --texto2: #C4C1B7; --muted: #A5A196;
        --serie: #8FB0E0; --bueno: #5FBF88; --critico: #E48373; --aviso: #D9B65A;
        --sobre-serie: #141413;
        --rampa-0: #2B476F; --rampa-1: #36588A; --rampa-2: #4468A0; --rampa-3: #5879B1;
        --rampa-4: #6F90C4; --rampa-5: #86A6D3; --rampa-6: #A0BCE0; --rampa-7: #BDD1EC;
        --chip-rojo-bg: rgba(228,131,115,.16); --chip-rojo-fg: #F0A89B; --chip-rojo-bd: rgba(228,131,115,.40);
        --chip-ambar-bg: rgba(217,182,90,.16); --chip-ambar-fg: #E6CB86; --chip-ambar-bd: rgba(217,182,90,.40);
        --chip-verde-bg: rgba(95,191,136,.16); --chip-verde-fg: #8AD3AA; --chip-verde-bd: rgba(95,191,136,.40);
        --chip-azul-bg: rgba(143,176,224,.16); --chip-azul-fg: #B2CBEC; --chip-azul-bd: rgba(143,176,224,.40);
        --chip-crema-bg: rgba(242,241,237,.07); --chip-crema-fg: #C9C5BA; --chip-crema-bd: #3C3B35;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0 28px 40px; background: var(--fondo); color: var(--texto);
           font-family: Arial, Helvetica, sans-serif; line-height: 1.45; }
    .pagina { max-width: 1360px; margin: 0 auto; }
    /* Enlaces propios: heredan el color y se subrayan solo al pasar el cursor (nunca el azul del navegador). */
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible, button:focus-visible, summary:focus-visible, select:focus-visible, input:focus-visible
      { outline: 2px solid var(--serie); outline-offset: 2px; }
    .enlace { color: var(--serie); text-decoration: underline; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
             justify-content: space-between; margin: 22px 0 20px; }
    h1 { margin: 0; font-size: 22px; }
    .marca { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    nav.filtros { display: flex; gap: 6px; font-size: 14px; }
    nav.filtros a { padding: 4px 12px; border: 1px solid var(--borde); border-radius: 999px;
                    color: var(--texto2); background: var(--superficie); }
    nav.filtros a[aria-current="true"] { color: var(--texto); border-color: var(--serie); font-weight: 600; }

    /* ---- barra superior (nav.sesion) ---- */
    nav.sesion { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between;
                 padding: 18px 0 0; font-size: 14px; }
    .topbar-izq { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; min-width: 0; }
    .brand { font-family: "Courier New", ui-monospace, Menlo, monospace; font-size: 13px; letter-spacing: .14em;
             color: var(--muted); font-weight: 700; white-space: nowrap; }
    .tabs { display: flex; flex-wrap: wrap; }
    .tab { display: inline-block; padding: 8px 14px; color: var(--muted); border-bottom: 3px solid transparent; }
    .tab:hover { color: var(--texto); text-decoration: none; }
    .tab.activa { color: var(--texto); border-bottom-color: var(--serie); font-weight: 700; }
    .topbar-der { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; min-width: 0; }
    nav.sesion form { margin: 0; }
    nav.sesion form.ver-como { display: flex; gap: 6px; align-items: center; max-width: 100%; }
    nav.sesion form.ver-como select { font: inherit; font-size: 13px; padding: 5px 8px; max-width: 100%; min-width: 0;
                                      border: 1px solid var(--borde); border-radius: var(--radio);
                                      background: var(--superficie); color: var(--texto); }
    nav.sesion button { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; cursor: pointer;
                        border: 1px solid var(--serie); border-radius: var(--radio);
                        background: var(--superficie); color: var(--serie); }
    nav.sesion button:hover { background: var(--chip-azul-bg); }
    .solo-lectores { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .banner-ver-como { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between;
                       margin: 14px 0 0; padding: 10px 12px; border-radius: var(--radio); font-size: 14px;
                       border: 1px solid var(--aviso); border-left-width: 6px; background: var(--superficie);
                       color: var(--texto); overflow-wrap: anywhere; }
    .banner-ver-como form { margin: 0; }
    .banner-ver-como button { font: inherit; font-size: 13px; font-weight: 700; padding: 5px 12px; border: 1px solid var(--serie);
                              border-radius: var(--radio); background: var(--superficie); color: var(--serie); cursor: pointer; }
    fieldset.solo-vista { border: 0; margin: 0; padding: 0; min-width: 0; }
    .aviso-estado { margin: 12px 0 0; padding: 8px 12px; border-radius: var(--radio); font-size: 14px;
                    border: 1px solid var(--borde); background: var(--superficie); }
    .aviso-estado.ok { border-color: var(--bueno); } .aviso-estado.error { border-color: var(--critico); }
    table.oportunidades { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.oportunidades th, table.oportunidades td { text-align: left; padding: 8px 6px; vertical-align: top;
                                                       border-bottom: 1px solid var(--borde); }
    table.oportunidades th { font-size: 12px; color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); font-size: 13px; }
    details summary { cursor: pointer; color: var(--serie); }
    form.cambio { display: grid; gap: 8px; margin-top: 8px; min-width: 0; }
    form.cambio label { display: grid; gap: 2px; font-size: 12px; color: var(--texto2); }
    form.cambio input, form.cambio select { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--borde);
                                            border-radius: var(--radio); background: var(--fondo); color: var(--texto); min-width: 0; }
    form.inline { display: block; margin: 0; }
    @media (max-width: 720px) { table.oportunidades { display: block; overflow-x: auto; } }

    /* ---- tarjetas y rejillas heredadas (regional, operativo, análisis) ---- */
    .fila { display: grid; gap: 12px; margin-bottom: 12px; }
    .fila.tiles { grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
    .fila.pares { grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
    .card { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px 20px; min-width: 0; }
    .card h2, .card h3.titulo, .h2 { margin: 0 0 2px; font-size: 16px; line-height: 22px; font-weight: 700; color: var(--texto); }
    .card .sub, .sub { margin: 0 0 14px; font-size: 13px; line-height: 18px; color: var(--muted); }
    .subtitulo { margin: 14px 0 8px; font-size: 13px; font-weight: 700; color: var(--texto); }
    .valor { font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
    .delta { font-size: 13px; color: var(--texto2); margin: 6px 0 10px; }
    .delta b { font-weight: 600; }
    .vacio { color: var(--muted); font-size: 14px; margin: 0; }
    svg { display: block; max-width: 100%; height: auto; overflow: visible; }
    svg.grafico { max-width: 560px; }
    svg .etq { font-size: 12px; fill: var(--texto2); }
    svg .val { font-size: 12px; fill: var(--texto); font-weight: 600; }
    svg .conv { font-size: 11px; fill: var(--muted); font-weight: 400; }
    svg .marca:hover rect:not([fill="transparent"]) { opacity: .8; }
    svg .marca { font-size: inherit; letter-spacing: normal; text-transform: none; font-weight: inherit; color: inherit; }
    .salidas { margin: 12px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--texto2); }
    .salidas li + li { margin-top: 4px; }
    .tip { position: fixed; z-index: 10; pointer-events: none; padding: 6px 10px; border-radius: var(--radio);
           background: var(--texto); color: var(--superficie); font-size: 12px; max-width: 320px; }

    /* ---- vista de país ---- */
    .mono { font-family: "Courier New", ui-monospace, Menlo, monospace; }
    .chip { display: inline-block; padding: 2px 9px; border-radius: var(--radio); font-size: 12px; font-weight: 700;
            line-height: 18px; border: 1px solid var(--chip-crema-bd); background: var(--chip-crema-bg); color: var(--chip-crema-fg); }
    .chip.rojo { background: var(--chip-rojo-bg); color: var(--chip-rojo-fg); border-color: var(--chip-rojo-bd); }
    .chip.ambar { background: var(--chip-ambar-bg); color: var(--chip-ambar-fg); border-color: var(--chip-ambar-bd); }
    .chip.verde { background: var(--chip-verde-bg); color: var(--chip-verde-fg); border-color: var(--chip-verde-bd); }
    .chip.azul { background: var(--chip-azul-bg); color: var(--chip-azul-fg); border-color: var(--chip-azul-bd); }
    .chip.crema { background: var(--chip-crema-bg); color: var(--chip-crema-fg); border-color: var(--chip-crema-bd); }
    .chip.sol-verde { background: var(--bueno); border-color: var(--bueno); color: var(--sobre-serie); }
    .chip.sol-gris { background: var(--muted); border-color: var(--muted); color: var(--sobre-serie); }
    .chip.n { background: var(--superficie); color: var(--texto); border-color: var(--borde); }
    .chip.rango { padding: 6px 12px; font-size: 13px; background: var(--superficie); color: var(--serie); border-color: var(--borde); }
    a.chip:hover { text-decoration: none; border-color: var(--serie); }
    .chip[aria-current="true"] { background: var(--serie); border-color: var(--serie); color: var(--sobre-serie); }

    .cab { display: flex; flex-wrap: wrap; gap: 12px 16px; justify-content: space-between; align-items: flex-end;
           margin: 0; padding: 22px 0 16px; }
    .cab h1 { font-size: 32px; line-height: 38px; font-weight: 700; }
    .cab .frase { margin: 6px 0 0; font-size: 18px; line-height: 26px; color: var(--texto); }
    .cab .fecha { margin: 0; font-size: 14px; line-height: 20px; color: var(--muted); }
    .cab .rangos { display: flex; flex-wrap: wrap; gap: 6px; }

    .grid-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
    .kcard { background: var(--superficie); border: 1px solid var(--borde); border-top: 4px solid var(--borde);
             border-radius: var(--radio); padding: 16px 18px 14px; min-width: 0; }
    .kcard.rojo { border-top-color: var(--critico); } .kcard.azul { border-top-color: var(--serie); }
    .kcard.verde { border-top-color: var(--bueno); } .kcard.ambar { border-top-color: var(--aviso); }
    .kcard .kl { margin: 0; font-size: 13px; line-height: 18px; font-weight: 400; color: var(--muted); }
    .kv { font-size: 38px; line-height: 44px; font-weight: 700; color: var(--texto); }
    .kcard.rojo .kv { color: var(--critico); } .kcard.azul .kv { color: var(--serie); }
    .kcard.verde .kv { color: var(--bueno); } .kcard.ambar .kv { color: var(--aviso); }
    .kv-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
    .kd { font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
    .kcard .spark { width: 96px; height: 34px; }
    .kcard .spark polyline { stroke: var(--bueno); }
    .kcard .spark circle { fill: var(--bueno); }
    .fila-flex { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
    .fila-flex > * { min-width: 0; }
    .dos-cols { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .dos-cols > .card { margin: 0; }
    .dos-cols > .ancha { flex: 2 1 560px; } .dos-cols > .estrecha { flex: 1 1 320px; }

    /* calendario */
    .cal-barras { display: flex; align-items: flex-end; width: 100%; }
    .cal-barras .dia { flex: 1 1 0; min-width: 0; text-align: center; color: var(--muted); }
    .cal-barras a.dia:hover { text-decoration: none; }
    .cal-barras a.dia:hover .cal-b { opacity: .8; }
    .cal-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch;
               padding: 0 3px; border-bottom: 1px solid var(--borde); }
    .cal-b { display: block; width: 100%; }
    .cal-n { display: block; font-size: 11px; line-height: 14px; margin-bottom: 2px; color: var(--texto); text-align: center; }
    .etq-dia { display: block; margin-top: 6px; font-size: 11px; line-height: 14px; }
    .cal-barras .activo .etq-dia { font-weight: 700; color: var(--texto); }
    .leyenda { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--muted); align-items: center; }

    /* requiere atención */
    .item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--borde); }
    .item:first-of-type { border-top: 0; }
    .item > .chip { flex: none; white-space: nowrap; }
    .item > div { min-width: 0; overflow-wrap: anywhere; }
    .item > div.accion { flex: none; margin-left: auto; overflow-wrap: normal; }
    .item > div.accion .btn-sec { white-space: nowrap; }
    .item-t, .tk-t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
    .item-t { font-size: 14px; line-height: 19px; font-weight: 700; color: var(--texto); }
    .item-m { font-size: 12px; line-height: 17px; color: var(--muted); }
    .lista-items { margin: 0; padding: 0; list-style: none; }

    /* tablero */
    .tablero { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .col-tablero { background: var(--col); padding: 10px; min-width: 0; border-radius: var(--radio); }
    .col-tablero > h3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 10px;
                        font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--texto2); }
    .tarjeta-op { background: var(--superficie); border: 1px solid var(--borde); border-left: 5px solid var(--borde);
                  border-radius: var(--radio); padding: 10px 12px; margin: 0 0 8px; font-size: 13px; overflow-wrap: anywhere; min-width: 0; }
    .tarjeta-op.urg-rojo { border-left-color: var(--critico); } .tarjeta-op.urg-ambar { border-left-color: var(--aviso); }
    .tarjeta-op.urg-verde { border-left-color: var(--bueno); } .tarjeta-op.urg-gris { border-left-color: var(--muted); }
    .tarjeta-op.urg-borde { border-left-color: var(--neutro); }
    .tk-ref { display: block; font-size: 12px; line-height: 17px; color: var(--muted); }
    .tk-t { margin: 2px 0 2px; font-size: 14px; line-height: 19px; font-weight: 700; color: var(--texto); }
    .tk-i { margin: 0 0 6px; font-size: 12px; line-height: 17px; color: var(--muted); }
    .tk-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; }
    .tk-m { margin: 6px 0 0; font-size: 12px; line-height: 17px; color: var(--muted); }
    .tk-m.mas { margin: 4px 2px; }
    .acciones { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--borde); }
    .acciones details { font-size: 12px; min-width: 0; }
    .acciones details[open] { flex: 1 1 100%; }
    .acciones summary { font-weight: 700; }
    .filtro { font-size: 12px; min-width: 0; }
    .filtro[open] { flex: 1 1 100%; }
    .filtro summary { display: inline-block; list-style: none; padding: 5px 10px; font-weight: 700; color: var(--texto2);
                      border: 1px solid var(--borde); border-radius: var(--radio); background: var(--superficie); }
    .filtro summary::-webkit-details-marker { display: none; }
    .filtro .opciones { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    /* clasificación */
    .barra-h { display: block; height: 16px; background: var(--fondo); overflow: hidden; }
    .barra-h > i, .barra-h > span { display: block; height: 100%; background: var(--neutro); }
    .barra-h.rojo > span { background: var(--critico); } .barra-h.azul > span { background: var(--serie); }
    .fb { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; }
    .fb > span:first-child { width: 170px; flex: none; overflow-wrap: anywhere; }
    .fb > .barra-h { flex: 1; min-width: 0; }
    .fb > b { width: 34px; text-align: right; flex: none; }
    .lista-fb { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .barra-apilada { display: flex; width: 100%; min-height: 34px; overflow: hidden; background: var(--borde); font-size: 12px; font-weight: 700; }
    .barra-apilada > span { display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap;
                            min-width: 0; padding: 0 4px; color: var(--sobre-serie); }
    .cl-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .cl-card { background: var(--fondo); border-top: 4px solid var(--neutro); padding: 10px 12px; min-width: 0; }
    .cl-card.rojo { border-top-color: var(--critico); } .cl-card.gris { border-top-color: var(--muted); }
    .cl-card.ambar { border-top-color: var(--aviso); }
    .cl-card .kl { font-size: 13px; color: var(--muted); }
    .cl-v { font-size: 26px; line-height: 32px; font-weight: 700; color: var(--texto); }
    .cl-card.rojo .cl-v { color: var(--critico); } .cl-card.ambar .cl-v { color: var(--aviso); }
    .dos-col-flex { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 14px; }
    .dos-col-flex > div { flex: 1 1 340px; min-width: 0; }
    .cab-card { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: flex-start; }
    .v-grid { display: flex; gap: 10px; margin-bottom: 14px; }
    .v-card { flex: 1; padding: 10px 12px; border-top: 4px solid var(--borde); }
    .v-card.verde { background: var(--chip-verde-bg); border-top-color: var(--bueno); }
    .v-card.rojo { background: var(--chip-rojo-bg); border-top-color: var(--critico); }
    .v-card .kl { font-size: 12px; color: var(--texto2); }
    .v-card .cl-v { color: var(--texto); }
    .v-card.verde .cl-v { color: var(--chip-verde-fg); } .v-card.rojo .cl-v { color: var(--chip-rojo-fg); }

    /* botones */
    .btn { display: inline-block; font: inherit; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: var(--radio);
           border: 1px solid var(--serie); background: var(--serie); color: var(--sobre-serie); cursor: pointer; }
    .btn-sec { display: inline-block; font: inherit; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: var(--radio);
               border: 1px solid var(--serie); background: var(--superficie); color: var(--serie); cursor: pointer; }
    .btn.xs, .btn-sec.xs { padding: 3px 10px; font-size: 12px; }
    .btn:hover, .btn-sec:hover { text-decoration: none; opacity: .88; }
    .caja-tabla { overflow-x: auto; max-width: 100%; }

    @media (max-width: 960px) {
      .grid-kpis, .tablero, .cl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      body { padding: 0 16px 32px; }
      .grid-kpis, .tablero { grid-template-columns: 1fr; }
      .kv { font-size: 32px; line-height: 38px; }
